name: Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '16'

      # Install
      - name: Install dependencies via yarn 📦
        run: yarn install --prefer-offline --frozen-lockfile

      # Run unit tests 🚀
      - name: Run tests
        run: yarn test
